<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andre Ricardo | Links</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1a1a24 0%, #08080c 100%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 380px;
      background: rgba(23, 23, 23, 0.8);
      backdrop-filter: blur(12px);
      padding: 32px 24px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .profile-img-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 16px;
    }

    .profile-img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    p {
      font-size: 0.9rem;
      color: #a1a1aa;
      margin-bottom: 28px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      background: #1f1f23;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 0.02em;
    }

    .btn:hover {
      background: #2a2a30;
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Destaque para o botão de compra */
    .btn-primary {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="profile-img-wrapper">
      <img src="https://i.ibb.co/8RY8RK5/Whats-App-Image-2026-10-06-at-23-21-20.jpg" alt="Andre Ricardo" class="profile-img">
    </div>

    <h1>Andre Ricardo</h1>
    <p>Entre em contato direto comigo 👇</p>

    <div class="links">
      <!-- Botão Secundário: Dúvidas / WhatsApp -->
      <a href="https://wa.me/5567991329424?text=Fala%20Andre%2C%20me%20explica%20mais%20a%20respeito%20do%20livro%20pfr!" target="_blank" class="btn">
        💬 DÚVIDAS AQUI
      </a>

      <!-- Botão Principal Destaque: Vendas / Produto -->
      <a href="https://pay.cakto.com.br/kebs5fk_1181189" target="_blank" class="btn btn-primary">
        🚀 COMPRE AQUI
      </a>
    </div>
  </div>

</body>
</html>
